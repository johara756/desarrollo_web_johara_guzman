<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda de Avistamientos</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <main>
        <h1>Búsqueda de Avistamientos</h1>

        <p>
            Busca un avistamiento por nombre del ave,
            voluntario o comuna.
        </p>

        <label for="search-input">Buscar:</label>

        <input
            type="text"
            id="search-input"
            placeholder="Escribe para buscar"
        >

        <div id="search-results"></div>
    </main>

    <script src="/js/search.js"></script>

</body>

</html>
